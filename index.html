<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dueling Grounds Script Hub</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #333;
        }
        h2 {
            color: #f1c40f;
            margin-bottom: 10px;
        }
        p {
            color: #bbb;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:active {
            background-color: #27ae60;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>⚔️ Dueling Grounds Ultimate ⚔️</h2>
    <p>กดปุ่มด้านล่างเพื่อคัดลอกสคริปต์ นำไปวางใน Delta Executor ได้เลย!</p>
    
    <button class="btn" onclick="copyScript()">📋 กดเพื่อคัดลอกสคริปต์ (Copy Script)</button>
    
    <div class="footer">Powered by oop280712-design</div>
</div>

<script>
function copyScript() {
    var scriptText = 'loadstring(game:HttpGet("https://raw.githubusercontent.com/oop280712-design/my-cloud-app/main/DuelingGrounds_Ultimate.lua"))()';
    navigator.clipboard.writeText(scriptText).then(function() {
        alert("คัดลอกสคริปต์เรียบร้อยแล้ว! นำไปวางใน Delta ได้เลย");
    }, function() {
        alert("ไม่สามารถคัดลอกได้ กรุณาลองใหม่อีกครั้ง");
    });
}
</script>

</body>
</html>
